name: GameTests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    name: Forge and Fabric GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run GameTests
        shell: bash
        run: |
          set +e
          timeout --foreground 1200s ./gradlew gameTest --no-daemon
          status=$?
          exit "$status"

      - name: Upload GameTest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-reports
          path: |
            projects/forge/build/test-results/turtlematic-gametest.xml
            projects/forge/build/test-results/turtlematic-gametest.html
            projects/fabric/build/test-results/turtlematic-gametest.xml
            projects/fabric/build/test-results/turtlematic-gametest.html
          if-no-files-found: warn
          retention-days: 14
